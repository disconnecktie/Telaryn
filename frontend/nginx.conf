# Serve the single-page application and keep browser/API traffic on one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($host = "www.telaryn.app") {
        return 308 https://telaryn.app$request_uri;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        # Buffer ordinary JSON and export responses before delivering them to
        # the HTTPS gateway; avoid forwarding a long sequence of tiny upstream
        # chunks. No API routes currently use server-sent event streaming.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_pass ${ATLAS_BACKEND_ORIGIN}/;
        proxy_http_version 1.1;
        # NGINX 1.27 sends Connection: close to upstreams by default, even
        # with HTTP/1.1. Azure Container Apps internal ingress has been
        # observed truncating large responses when that header is present.
        # Omit the hop-by-hop header so Envoy can finish delivering the body.
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
