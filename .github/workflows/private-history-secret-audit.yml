# One-time, read-only private-repository audit. Do not upload the findings JSON.
# Logs contain rule identifiers and file paths ONLY, never secret values or snippets.
name: Telaryn Private History Secret Audit

on:
  pull_request:
  push:
    branches:
      - release/source-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-secrets:
    name: Audit all retained branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branch and tag refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          branch_count=$(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)
          tag_count=$(git for-each-ref --format='%(refname)' refs/tags | wc -l)
          commit_count=$(git rev-list --all --count)
          echo "Remote branch refs: $branch_count"
          echo "Tag refs: $tag_count"
          echo "Unique reachable commits: $commit_count"
          if [ "$branch_count" -lt 1 ]; then
            echo "Scan aborted: no branch refs found. Check fetch permissions."
            exit 2
          fi

      - name: Install pinned Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output /tmp/gitleaks_8.30.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          mkdir -p /tmp/telaryn-gitleaks-bin
          tar -xzf /tmp/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp/telaryn-gitleaks-bin gitleaks
          sudo install -m 0755 /tmp/telaryn-gitleaks-bin/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan all reachable Git history without exposing matched secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/telaryn-history-audit
          set +e
          gitleaks git . \
            --no-banner \
            --log-level error \
            --redact=100 \
            --log-opts="--all" \
            --report-format=json \
            --report-path=/tmp/telaryn-history-audit/history-redacted.json \
            --exit-code=7 \
            >/tmp/telaryn-history-audit/scanner.stdout \
            2>/tmp/telaryn-history-audit/scanner.stderr
          scan_exit=$?
          set -e
          if [ "$scan_exit" -ne 0 ] && [ "$scan_exit" -ne 7 ]; then
            echo "Gitleaks could not complete the scan (exit $scan_exit)."
            exit "$scan_exit"
          fi
          if [ "$scan_exit" -eq 7 ] && [ ! -f /tmp/telaryn-history-audit/history-redacted.json ]; then
            echo "Gitleaks reported matches but produced no report."
            exit 3
          fi
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          report = Path("/tmp/telaryn-history-audit/history-redacted.json")
          findings = json.loads(report.read_text()) if report.exists() else []
          if not isinstance(findings, list):
              raise SystemExit("Invalid scanner report shape")
          rule_counts = collections.Counter(
              str(finding.get("RuleID", "unknown")) for finding in findings
          )
          path_counts = collections.Counter(
              str(finding.get("File", "unknown")) for finding in findings
          )
          lines = [
              "## Telaryn private source history scan (Gitleaks 8.30.1)",
              "",
              f"Potential findings: {len(findings)}",
              f"Affected paths: {len(path_counts)}",
              "",
              "### Rule identifiers and counts (no secret values)",
          ]
          for rule, count in rule_counts.most_common():
              lines.append(f"- {rule}: {count}")
          if not rule_counts:
              lines.append("- None")
          lines.extend(["", "### Most affected paths (no matched snippets)"])
          for name, count in path_counts.most_common(25):
              lines.append(f"- {name.replace(chr(10), '?').replace(chr(13), '?')}: {count}")
          if not path_counts:
              lines.append("- None")
          lines.extend(["", "### Exact finding locations (no matched text or values)"])
          for finding in findings[:30]:
              name = str(finding.get("File", "unknown")).replace(chr(10), "?").replace(chr(13), "?")
              commit = str(finding.get("Commit", "unknown"))[:12]
              line = finding.get("StartLine", "unknown")
              rule = str(finding.get("RuleID", "unknown"))
              lines.append(f"- {name} | commit {commit} | line {line} | rule {rule}")
          if not findings:
              lines.append("- None")
          summary = "\n".join(lines) + "\n"
          print(summary)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(summary)
          if findings:
              raise SystemExit("Potential secrets detected. Keep repository private and triage locally.")
          PY

      - name: Final reminder
        if: always()
        shell: bash
        run: |
          echo "No scan report is uploaded as an artifact; scanned current Telaryn Git history only."
          echo "This run does not inspect deleted/unreachable Git objects or earlier Actions logs."
