name: Telaryn Source Review CI

on:
  pull_request:
  push:
    branches:
      - release/source-candidate

permissions:
  contents: read

jobs:
  source-boundary:
    name: Source boundary checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reviewed paths and known sensitive markers
        run: python scripts/verify_source_snapshot.py
      - name: Validate clean-history export allowlist without writing anything
        run: python scripts/prepare_clean_release.py --check-only

  publication-gate:
    name: Public release gate (expected to fail until reviewed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse unreconciled commit identities and migration-specific operations
        run: python scripts/verify_source_snapshot.py --publication-gate

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run backend unit tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  local-integration:
    name: Container configuration and migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Compose syntax
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --tag telaryn-backend:candidate .
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag telaryn-frontend:candidate .
      - name: Run temporary PostgreSQL migration smoke
        run: |
          docker compose up --detach --wait postgres
          docker compose run --rm backend alembic upgrade head
          docker compose run --rm backend python -m app.postgres_verification
          docker compose down --volumes
